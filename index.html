<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon City</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:system-ui,sans-serif;color:white}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}#brand{position:absolute;top:14px;right:14px;background:#07131dcc;padding:9px 14px;border:1px solid #40d9c5;border-radius:12px;font-weight:800}#hint{position:absolute;top:62px;right:14px;background:#07131dbb;padding:7px 10px;border-radius:9px;font-size:12px}#joy{position:absolute;bottom:25px;left:25px;width:125px;height:125px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff66;pointer-events:auto;touch-action:none}#nub{position:absolute;width:48px;height:48px;border-radius:50%;background:#40d9c5cc;left:36px;top:36px}#action{position:absolute;bottom:40px;right:28px;width:76px;height:76px;border:0;border-radius:50%;background:#40d9c5;color:#06211e;font-weight:900;font-size:14px;pointer-events:auto}#status{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#d6e8e7;background:#07131daa;padding:5px 9px;border-radius:8px;white-space:nowrap}
</style>
</head>
<body>
<div id="hud"><div id="brand">NEON CITY</div><div id="hint">تحرّك بالعصا • اسحب الشاشة لتدوير الكاميرا</div><div id="joy"><div id="nub"></div></div><button id="action">قفز</button><div id="status">نسخة تجريبية أصلية • مدينة ثلاثية الأبعاد</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bb8c8);scene.fog=new THREE.Fog(0x8bb8c8,35,125);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xcceeff,0x52606a,2));const sun=new THREE.DirectionalLight(0xffedcf,2.2);sun.position.set(-25,45,20);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshStandardMaterial({color:0x35434a,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roadMat=new THREE.MeshStandardMaterial({color:0x202a30}),lineMat=new THREE.MeshStandardMaterial({color:0xe4d9a2});
for(let i=-5;i<=5;i++){let road=new THREE.Mesh(new THREE.BoxGeometry(9,.06,220),roadMat);road.position.set(i*20,.03,0);scene.add(road);let cross=new THREE.Mesh(new THREE.BoxGeometry(220,.06,9),roadMat);cross.position.set(0,.035,i*20);scene.add(cross)}
for(let i=-5;i<=5;i++)for(let j=-5;j<=5;j++){if(Math.abs(i)%2===0&&Math.abs(j)%2===0)continue;let x=i*20+(Math.random()-.5)*5,z=j*20+(Math.random()-.5)*5,w=7+Math.random()*5,d=7+Math.random()*5,h=8+Math.random()*30;let mat=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.52+Math.random()*.12,.18,.24+Math.random()*.2),roughness:.8});let b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);for(let y=2;y<h-1;y+=2.5){for(let xx=-w/2+1;xx<w/2;xx+=2){let win=new THREE.Mesh(new THREE.BoxGeometry(.75,1,.08),new THREE.MeshStandardMaterial({color:0x83d9d2,emissive:0x245d5b,emissiveIntensity:.35}));win.position.set(x+xx,y,z+d/2+.05);scene.add(win)}}}
const player=new THREE.Group();scene.add(player);const skin=new THREE.MeshStandardMaterial({color:0xe2a77d}),shirt=new THREE.MeshStandardMaterial({color:0x16b6a4}),pants=new THREE.MeshStandardMaterial({color:0x25364b});const torso=new THREE.Mesh(new THREE.BoxGeometry(.8,1.05,.42),shirt);torso.position.y=1.45;player.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.29,16,12),skin);head.position.y=2.2;player.add(head);for(let s of [-1,1]){let leg=new THREE.Mesh(new THREE.BoxGeometry(.27,.8,.3),pants);leg.position.set(s*.22,.48,0);player.add(leg);let arm=new THREE.Mesh(new THREE.BoxGeometry(.22,.85,.24),skin);arm.position.set(s*.53,1.48,0);player.add(arm)}
player.position.set(0,0,0);let yaw=0,moveX=0,moveY=0,velY=0,grounded=true;const joy=document.getElementById('joy'),nub=document.getElementById('nub');let joyOn=false;function joyMove(e){let r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=Math.min(42,Math.hypot(x,y)),a=Math.atan2(y,x);moveX=Math.cos(a)*m/42;moveY=Math.sin(a)*m/42;nub.style.left=(36+Math.cos(a)*m)+'px';nub.style.top=(36+Math.sin(a)*m)+'px'}joy.addEventListener('pointerdown',e=>{joyOn=true;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(joyOn)joyMove(e)});function joyEnd(){joyOn=false;moveX=moveY=0;nub.style.left='36px';nub.style.top='36px'}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
let keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.getElementById('action').onclick=()=>{if(grounded){velY=8;grounded=false}};
let dragging=false,lastX=0;addEventListener('pointerdown',e=>{if(e.target===renderer.domElement){dragging=true;lastX=e.clientX}});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(dragging){yaw-=(e.clientX-lastX)*.006;lastX=e.clientX}});
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.04);let ix=moveX+(keys.d?1:0)-(keys.a?1:0),iy=moveY+(keys.s?1:0)-(keys.w?1:0);let len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len}let forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));player.position.addScaledVector(forward,-iy*7*dt);player.position.addScaledVector(right,ix*7*dt);if(len>.08)player.rotation.y=Math.atan2(-forward.x*(-iy)+right.x*ix,-forward.z*(-iy)+right.z*ix);velY-=20*dt;player.position.y+=velY*dt;if(player.position.y<0){player.position.y=0;velY=0;grounded=true}let target=new THREE.Vector3(player.position.x+Math.sin(yaw)*8,player.position.y+4.5,player.position.z+Math.cos(yaw)*8);camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(player.position.x,player.position.y+1.2,player.position.z);renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
